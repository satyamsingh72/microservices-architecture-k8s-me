name: Build, Push & Deploy

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "k8s/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [auth-service, product-service, order-service, frontend]

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
          cache-from: type=registry,ref=${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service }}:cache
          cache-to: type=registry,ref=${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service }}:cache,mode=max

  update-manifests:
    runs-on: ubuntu-latest
    needs: build

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Sync with remote
        run: git pull --rebase

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      # ✅ Correct: update ONLY Deployment docs inside multi-doc YAML
      - name: Update Kubernetes manifests safely
        run: |
          for file in k8s/*.yaml; do
            yq -i '
              select(.kind == "Deployment")
              .spec.template.spec.containers[0].image =
              strenv(DOCKERHUB_USERNAME) + "/" + .metadata.name + ":" + strenv(IMAGE_TAG)
            ' "$file"
          done

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add k8s/
          git commit -m "Update images to ${IMAGE_TAG}" || echo "No changes to commit"
          git push