name: Build, Push & Deploy

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "k8s/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [auth-service, product-service, order-service, frontend]

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
          cache-from: type=registry,ref=${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service }}:cache
          cache-to: type=registry,ref=${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service }}:cache,mode=max

  update-manifests:
    runs-on: ubuntu-latest
    needs: build

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync with remote
        run: git pull --rebase

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: Update Kubernetes manifests (targeted + safe)
        run: |
          for file in k8s/*.yaml; do
            yq -i '
              select(
                .kind == "Deployment" and
                (.metadata.name | test("^(auth-service|product-service|order-service|frontend)$"))
              )
              .spec.template.spec.containers[].image =
                strenv(DOCKERHUB_USERNAME) + "/" + .metadata.name + ":" + strenv(IMAGE_TAG)
            ' "$file"
          done

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add k8s/
          git commit -m "Update images to ${IMAGE_TAG}" || echo "No changes to commit"
          git push