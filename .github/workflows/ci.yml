name: Build, Push & Update Helm Values

on:
  push:
    branches:
      - main
    paths-ignore:
      - "helm/**"
      - "infra/**"

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - frontend
          - auth-service
          - product-service
          - order-service
    
    env:
      IMAGE_TAG: ${{ github.sha }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
  
  update-helm-values:
    runs-on: ubuntu-latest
    needs: build-and-push
    
    env:
      IMAGE_TAG: ${{ github.sha }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Pull Latest Changes
        run: git pull --rebase
      
      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq
      
      - name: Update Helm values.yaml
        run: |
          yq -i '.frontend.image = strenv(DOCKERHUB_USERNAME) + "/frontend:" + strenv(IMAGE_TAG)' helm/microservices/values.yaml
          yq -i '.auth.image = strenv(DOCKERHUB_USERNAME) + "/auth-service:" + strenv(IMAGE_TAG)' helm/microservices/values.yaml
          yq -i '.product.image = strenv(DOCKERHUB_USERNAME) + "/product-service:" + strenv(IMAGE_TAG)' helm/microservices/values.yaml
          yq -i '.order.image = strenv(DOCKERHUB_USERNAME) + "/order-service:" + strenv(IMAGE_TAG)' helm/microservices/values.yaml
      
      - name: Commit and Push Updated values.yaml
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add helm/microservices/values.yaml
          git commit -m "Update Helm image tags to ${IMAGE_TAG}" || echo "No changes to commit"
          git push