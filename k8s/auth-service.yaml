apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: auth-service
        image: lsingodiya/auth-service:v3
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5001
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: microservice-config
              key: AUTH_PORT
        - name: MONGO_URI
          value: "mongodb://$(MONGO_HOST):$(MONGO_PORT)/$(AUTH_DB)"
        - name: MONGO_HOST
          valueFrom:
            configMapKeyRef:
              name: microservice-config
              key: MONGO_HOST
        - name: MONGO_PORT
          valueFrom:
            configMapKeyRef:
              name: microservice-config
              key: MONGO_PORT
        - name: AUTH_DB
          valueFrom:
            configMapKeyRef:
              name: microservice-config
              key: AUTH_DB
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: microservice-secrets
              key: JWT_SECRET
        livenessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  type: ClusterIP
  ports:
  - port: 5001
    targetPort: 5001
  selector:
    app: auth-service
