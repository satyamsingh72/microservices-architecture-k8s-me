##############################################################################
# PersistentVolume — kubeadm on EC2 (bare metal / self-managed)
#
# Uses hostPath to store MongoDB data on the EC2 instance's local disk.
# nodeAffinity pins the PV to a specific node so MongoDB *always* schedules
# to the same EC2 instance where the actual data directory lives.
#
# ─── SETUP STEPS ────────────────────────────────────────────────────────────
# 1. Find your node name:
#      kubectl get nodes
#
# 2. Replace <YOUR-EC2-NODE-NAME> below with that name (e.g. ip-10-0-1-42).
#
# 3. Create the data directory ON THAT EC2 INSTANCE:
#      sudo mkdir -p /data/mongodb
#      sudo chmod 777 /data/mongodb
#
# 4. Apply:
#      kubectl apply -f k8s/pv.yaml
#      kubectl apply -f k8s/mongodb.yaml   ← PVC will bind to this PV
#
# ─── MULTI-NODE NOTE ────────────────────────────────────────────────────────
# If you have >1 worker node and want proper HA storage, install the
# AWS EBS CSI driver instead and use a StorageClass for dynamic provisioning:
#   https://github.com/kubernetes-sigs/aws-ebs-csi-driver
##############################################################################

apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongodb-pv
  labels:
    type: local
    app: mongodb
spec:
  storageClassName: manual # must match PVC storageClassName
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain # data survives PVC deletion
  hostPath:
    path: /data/mongodb # path ON the EC2 node
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ip-172-31-31-31 # ← replace with: kubectl get nodes
