##############################################################################
# Ingress Resource — Routes external traffic into the cluster
#
# ─── EC2 / kubeadm SETUP ────────────────────────────────────────────────────
# 1. Install ingress controller (baremetal variant):
#    kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/baremetal/deploy.yaml
#
# 2. Fix NodePorts to 30080/30443:
#    kubectl apply -f k8s/ingress-nginx-patch.yaml
#
# 3. Apply this Ingress resource:
#    kubectl apply -f k8s/ingress.yaml
#
# 4. Access via:  http://<EC2-PUBLIC-IP>:30080
#
# ─── ROUTING RULES ──────────────────────────────────────────────────────────
#   /api/auth/*      → auth-service:5001
#   /api/products/*  → product-service:5002
#   /api/orders/*    → order-service:5003
#   /*               → frontend:80  (React SPA)
##############################################################################

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservice-ingress
  namespace: default
  annotations:
    # Ingress class (required for newer nginx controller versions)
    kubernetes.io/ingress.class: "nginx"
    # Enable regex-based path matching
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Max upload body size (for product images etc.)
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Timeouts (seconds)
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # CORS — allow browser requests from the frontend origin
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    # Preserve client IP in X-Forwarded-For
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
spec:
  ingressClassName: nginx # modern alternative to annotation above
  rules:
    - http: # no host = matches any EC2 IP or hostname
        paths:
          # ── Backend API routes (most-specific first) ──────────────────────
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 5001
          - path: /api/products
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  number: 5002
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 5003
          # ── Frontend SPA (catch-all — MUST be last) ───────────────────────
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
