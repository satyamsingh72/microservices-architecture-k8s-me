##############################################################################
# Nginx Ingress Controller — NodePort patch for kubeadm on EC2
#
# STEP 1: Install the upstream baremetal ingress controller:
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/baremetal/deploy.yaml
#
# STEP 2: Wait for it to be ready:
#   kubectl wait --namespace ingress-nginx \
#     --for=condition=ready pod \
#     --selector=app.kubernetes.io/component=controller \
#     --timeout=120s
#
# STEP 3: Apply this file to fix the NodePorts to known values:
#   kubectl apply -f k8s/ingress-nginx-patch.yaml
#
# STEP 4: Open these ports in your EC2 Security Group (inbound rules):
#   Port 30080  → HTTP  (0.0.0.0/0 or your IP)
#   Port 30443  → HTTPS (0.0.0.0/0 or your IP)
#
# STEP 5: Access your app:
#   http://<EC2-PUBLIC-IP>:30080
##############################################################################

apiVersion: v1
kind: Service
metadata:
  name: ingress-nginx-controller
  namespace: ingress-nginx
  labels:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/component: controller
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/component: controller
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080 # ← fixed HTTP port — open this in EC2 Security Group
      protocol: TCP
    - name: https
      port: 443
      targetPort: https
      nodePort: 30443 # ← fixed HTTPS port — open this in EC2 Security Group
      protocol: TCP
